[project]
name = "quantum-buddy-backend"
version = "0.1.0"
description = "API local de Q-Anacleto y Q-Boby"
requires-python = ">=3.11"
dependencies = [
    "qiskit==2.5.2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: verificación estadística reproducible de QAE"]
